<!-- CSS - Add to your stylesheet -->
<style>
/* Component 5: Value Calculator */
.mv-calculator {
    max-width: 900px;
    margin: 80px auto;
    padding: 0 20px;
}

.mv-calculator-card {
    background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    border-radius: 32px;
    padding: 56px 48px;
    text-align: center;
    border: 1px solid rgba(0, 0, 0, 0.06);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
}

.mv-calculator h3 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 40px;
    color: #0f131a;
}

.mv-calculator-display {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 36px;
}

.mv-calc-box {
    background: #ffffff;
    padding: 28px 36px;
    border-radius: 20px;
    border: 1px solid rgba(0, 0, 0, 0.06);
    text-align: center;
    min-width: 160px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    transition: all 0.3s ease;
}

.mv-calc-box:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

.mv-calc-label {
    font-size: 0.75rem;
    color: rgba(15, 19, 26, 0.5);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 10px;
    font-weight: 600;
}

.mv-calc-value {
    font-size: 2.25rem;
    font-weight: 800;
    line-height: 1.1;
}

.mv-calc-value.original {
    color: rgba(15, 19, 26, 0.35);
    text-decoration: line-through;
    position: relative;
}

.mv-calc-value.savings {
    color: #7a12d4;
}

.mv-calc-value.pay {
    color: #10b981;
}

.mv-calc-operator {
    font-size: 2rem;
    color: rgba(15, 19, 26, 0.2);
    font-weight: 300;
}

.mv-calculator-result {
    font-size: 1.35rem;
    color: rgba(15, 19, 26, 0.7);
    margin-bottom: 32px;
}

.mv-calculator-result .highlight {
    color: #7a12d4;
    font-weight: 700;
}

.mv-calculator-breakdown {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding-top: 28px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    flex-wrap: wrap;
}

.mv-calc-stat {
    text-align: center;
}

.mv-calc-stat-value {
    font-size: 1.75rem;
    font-weight: 800;
    color: #7a12d4;
}

.mv-calc-stat-label {
    font-size: 0.85rem;
    color: rgba(15, 19, 26, 0.5);
    margin-top: 4px;
}

/* Animated counter effect */
.mv-calc-value[data-animate] {
    transition: all 0.5s ease;
}

/* Responsive */
@media (max-width: 700px) {
    .mv-calculator-card {
        padding: 40px 28px;
    }

    .mv-calculator h3 {
        font-size: 1.5rem;
    }

    .mv-calculator-display {
        flex-direction: column;
        gap: 16px;
    }

    .mv-calc-operator {
        transform: rotate(90deg);
    }

    .mv-calc-box {
        width: 100%;
        max-width: 280px;
    }

    .mv-calculator-breakdown {
        flex-direction: column;
        gap: 24px;
    }
}
</style>

<!-- HTML - Paste where you want the component -->
<div class="mv-calculator" data-test="calculator-v1">
    <div class="mv-calculator-card">
        <h3>See What You're Really Getting</h3>

        <div class="mv-calculator-display">
            <div class="mv-calc-box">
                <div class="mv-calc-label">Total Content Value</div>
                <div class="mv-calc-value original" data-animate>$38,000+</div>
            </div>

            <span class="mv-calc-operator">→</span>

            <div class="mv-calc-box">
                <div class="mv-calc-label">Black Friday Price</div>
                <div class="mv-calc-value pay" data-animate>$199</div>
            </div>

            <span class="mv-calc-operator">=</span>

            <div class="mv-calc-box">
                <div class="mv-calc-label">Your Savings</div>
                <div class="mv-calc-value savings" data-animate>99.5%</div>
            </div>
        </div>

        <p class="mv-calculator-result">
            That's access to everything for less than <span class="highlight">$0.54/day</span>
        </p>

        <div class="mv-calculator-breakdown">
            <div class="mv-calc-stat">
                <div class="mv-calc-stat-value">100+</div>
                <div class="mv-calc-stat-label">Programs Included</div>
            </div>
            <div class="mv-calc-stat">
                <div class="mv-calc-stat-value">50+</div>
                <div class="mv-calc-stat-label">World-Class Teachers</div>
            </div>
            <div class="mv-calc-stat">
                <div class="mv-calc-stat-value">20M+</div>
                <div class="mv-calc-stat-label">Community Members</div>
            </div>
        </div>
    </div>
</div>

<!-- TRACKING SCRIPT -->
<script>
(function() {
    const component = document.querySelector('[data-test="calculator-v1"]');
    if (!component) return;

    // Track impression when visible
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                if (window.dataLayer) {
                    dataLayer.push({
                        'event': 'ab_test_impression',
                        'test_name': 'value_calculator',
                        'variant': 'visual_math',
                        'component_id': 'calculator-v1'
                    });
                }

                // Animate values on view
                animateValues();
                observer.disconnect();
            }
        });
    }, { threshold: 0.5 });

    observer.observe(component);

    // Simple animation for values
    function animateValues() {
        const values = component.querySelectorAll('[data-animate]');
        values.forEach((el, i) => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';

            setTimeout(() => {
                el.style.transition = 'all 0.6s ease';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, i * 200);
        });
    }
})();
</script>
