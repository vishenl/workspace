<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audioguides - Meditation Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #000000;
      --bg-card: #1c1c1e;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.5);
      --accent-purple: #9B6FF0;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      font-family: var(--font);
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    /* Phone Frame */
    .phone-frame {
      width: 375px;
      height: 812px;
      background: var(--bg-dark);
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 12px #1a1a1a,
        0 0 0 14px #333,
        0 50px 100px rgba(0, 0, 0, 0.5);
    }

    .player {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Background */
    .ambient-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: float 8s ease-in-out infinite;
    }

    .blob-1 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #9B6FF0, #667eea);
      top: -100px;
      left: -50px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      bottom: 100px;
      right: -80px;
      animation-delay: -2s;
    }

    .blob-3 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      bottom: -50px;
      left: 50px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(30px, -30px) scale(1.1);
      }
      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px 20px 20px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .close-btn svg {
      width: 20px;
      height: 20px;
      color: var(--text-primary);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
      color: var(--text-primary);
    }

    /* Album Art */
    .album-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    .album-art {
      width: 280px;
      height: 280px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-art::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      pointer-events: none;
    }

    /* Visualizer */
    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-top: 24px;
      height: 40px;
    }

    .visualizer-bar {
      width: 4px;
      background: var(--accent-purple);
      border-radius: 2px;
      animation: visualize 0.8s ease-in-out infinite;
    }

    .visualizer-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
    .visualizer-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
    .visualizer-bar:nth-child(3) { height: 25px; animation-delay: 0.2s; }
    .visualizer-bar:nth-child(4) { height: 35px; animation-delay: 0.3s; }
    .visualizer-bar:nth-child(5) { height: 20px; animation-delay: 0.4s; }
    .visualizer-bar:nth-child(6) { height: 28px; animation-delay: 0.5s; }
    .visualizer-bar:nth-child(7) { height: 22px; animation-delay: 0.6s; }

    @keyframes visualize {
      0%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(0.5);
      }
    }

    /* Controls Section */
    .controls-section {
      position: relative;
      z-index: 10;
      padding: 24px 24px 48px;
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    }

    /* Track Info */
    .track-info {
      text-align: center;
      margin-bottom: 24px;
    }

    .track-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .track-author {
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* Progress Bar */
    .progress-container {
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: visible;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: var(--text-primary);
      border-radius: 2px;
      width: 35%;
      position: relative;
      transition: width 0.1s;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: var(--text-primary);
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Main Controls */
    .main-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
    }

    .skip-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .skip-btn:hover {
      transform: scale(1.1);
    }

    .skip-btn svg {
      width: 28px;
      height: 28px;
      color: var(--text-primary);
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--text-primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    .play-btn svg {
      width: 32px;
      height: 32px;
      color: var(--bg-dark);
    }

    /* Secondary Controls */
    .secondary-controls {
      display: flex;
      justify-content: center;
      gap: 48px;
    }

    .secondary-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s;
    }

    .secondary-btn:hover {
      color: var(--text-primary);
    }

    .secondary-btn svg {
      width: 22px;
      height: 22px;
    }

    .secondary-btn span {
      font-size: 11px;
      font-weight: 500;
    }

    /* Sound Mixer */
    .sound-mixer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--bg-card);
      border-radius: 16px;
      margin-top: 20px;
    }

    .mixer-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mixer-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mixer-icon svg {
      width: 20px;
      height: 20px;
      color: white;
    }

    .mixer-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .mixer-subtext {
      font-size: 11px;
      color: var(--text-muted);
    }

    .mixer-control {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .volume-slider {
      width: 80px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
    }

    .volume-fill {
      height: 100%;
      width: 60%;
      background: var(--text-primary);
      border-radius: 2px;
    }

    .mixer-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mixer-btn svg {
      width: 16px;
      height: 16px;
      color: var(--text-primary);
    }

    /* Responsive */
    @media (max-width: 420px) {
      body {
        padding: 0;
      }

      .phone-frame {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="player">
      <!-- Ambient Background -->
      <div class="ambient-bg">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="ambient-blob blob-3"></div>
      </div>

      <!-- Top Bar -->
      <div class="top-bar">
        <button class="close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6,9 12,15 18,9"/>
          </svg>
        </button>
        <div class="top-actions">
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4"/>
              <path d="M12 8h.01"/>
            </svg>
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="1"/>
              <circle cx="19" cy="12" r="1"/>
              <circle cx="5" cy="12" r="1"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Album Art Section -->
      <div class="album-section">
        <div class="album-art">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600&h=600&fit=crop&crop=face" alt="Healing with Your Guides">
        </div>
        <div class="visualizer">
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
          <div class="visualizer-bar"></div>
        </div>
      </div>

      <!-- Controls Section -->
      <div class="controls-section">
        <!-- Track Info -->
        <div class="track-info">
          <h1 class="track-title">Healing with Your Guides</h1>
          <p class="track-author">Sonia Choquette</p>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill">
              <div class="progress-thumb"></div>
            </div>
          </div>
          <div class="progress-times">
            <span>4:12</span>
            <span>12:00</span>
          </div>
        </div>

        <!-- Main Controls -->
        <div class="main-controls">
          <button class="skip-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              <text x="12" y="14" font-size="6" text-anchor="middle" fill="currentColor" font-weight="bold">15</text>
            </svg>
          </button>
          <button class="play-btn" id="playBtn">
            <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </button>
          <button class="skip-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
              <text x="12" y="14" font-size="6" text-anchor="middle" fill="currentColor" font-weight="bold">15</text>
            </svg>
          </button>
        </div>

        <!-- Secondary Controls -->
        <div class="secondary-controls">
          <button class="secondary-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Airplay</span>
          </button>
          <button class="secondary-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 1l4 4-4 4"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <path d="M7 23l-4-4 4-4"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
            <span>Repeat</span>
          </button>
          <button class="secondary-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Timer</span>
          </button>
        </div>

        <!-- Sound Mixer -->
        <div class="sound-mixer">
          <div class="mixer-info">
            <div class="mixer-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
              </svg>
            </div>
            <div>
              <div class="mixer-text">Crystal Waves</div>
              <div class="mixer-subtext">Background sound</div>
            </div>
          </div>
          <div class="mixer-control">
            <div class="volume-slider">
              <div class="volume-fill"></div>
            </div>
            <button class="mixer-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    let isPlaying = true;

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.innerHTML = `
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        `;
      } else {
        playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    });
  </script>
</body>
</html>
